# ============================================
# Per-Zone Return Temperature Sensors
# ============================================
# DS18B20 sensors at the manifold return for each zone
# Used for hydraulic balancing algorithm
#
# Configure Dallas addresses in config.yaml substitutions:
#   dallasaddress_zone_1_return: "0x..."
#   dallasaddress_zone_2_return: "0x..."
#   etc.
#
# Set to "0" or leave undefined to disable a zone's return sensor

sensor:
  # ============================================
  # Zone 1 Return Temperature
  # ============================================
  - platform: dallas_temp
    setup_priority: -100
    address: ${dallasaddress_zone_1_return}
    name: "Zone 1 Return Temp"
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-water"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 2
    update_interval: 30s
    id: ${id_prefix}zone_1_return_temp
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  # ============================================
  # Zone 2 Return Temperature
  # ============================================
