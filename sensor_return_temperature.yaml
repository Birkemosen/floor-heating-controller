  # ============================================
  # Calculated Sensors for Hydraulic Balancing
  # ============================================
  
  # Average return temperature across all active zones
  - platform: template
    name: "Average Return Temp"
    id: ${id_prefix}avg_return_temp
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-lines"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      float sum = 0;
      int count = 0;
      
      // Only include zones that have valid readings and are active
      if (!std::isnan(id(${id_prefix}zone_1_return_temp).state) && id(${id_prefix}zone_1_return_temp).state > 0) {
        sum += id(${id_prefix}zone_1_return_temp).state;
        count++;
      }
      if (!std::isnan(id(${id_prefix}zone_2_return_temp).state) && id(${id_prefix}zone_2_return_temp).state > 0) {
        sum += id(${id_prefix}zone_2_return_temp).state;
        count++;
      }
      if (!std::isnan(id(${id_prefix}zone_3_return_temp).state) && id(${id_prefix}zone_3_return_temp).state > 0) {
        sum += id(${id_prefix}zone_3_return_temp).state;
        count++;
      }
      if (!std::isnan(id(${id_prefix}zone_4_return_temp).state) && id(${id_prefix}zone_4_return_temp).state > 0) {
        sum += id(${id_prefix}zone_4_return_temp).state;
        count++;
      }
      if (!std::isnan(id(${id_prefix}zone_5_return_temp).state) && id(${id_prefix}zone_5_return_temp).state > 0) {
        sum += id(${id_prefix}zone_5_return_temp).state;
        count++;
      }
      if (!std::isnan(id(${id_prefix}zone_6_return_temp).state) && id(${id_prefix}zone_6_return_temp).state > 0) {
        sum += id(${id_prefix}zone_6_return_temp).state;
        count++;
      }
      if (!std::isnan(id(${id_prefix}zone_7_return_temp).state) && id(${id_prefix}zone_7_return_temp).state > 0) {
        sum += id(${id_prefix}zone_7_return_temp).state;
        count++;
      }
      if (!std::isnan(id(${id_prefix}zone_8_return_temp).state) && id(${id_prefix}zone_8_return_temp).state > 0) {
        sum += id(${id_prefix}zone_8_return_temp).state;
        count++;
      }
      
      if (count > 0) {
        return sum / count;
      }
      return NAN;

  # Supply-Return Spread (Delta T)
  - platform: template
    name: "Supply-Return Spread"
    id: ${id_prefix}supply_return_spread
    unit_of_measurement: "K"
    icon: "mdi:thermometer-chevron-down"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      if (!std::isnan(id(${id_prefix}dallas_input_temp).state) && 
          !std::isnan(id(${id_prefix}avg_return_temp).state)) {
        return id(${id_prefix}dallas_input_temp).state - id(${id_prefix}avg_return_temp).state;
      }
      return NAN;

  # Number of active return temperature sensors
  - platform: template
    name: "Active Return Sensors"
    id: ${id_prefix}active_return_sensors
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int count = 0;
      if (!std::isnan(id(${id_prefix}zone_1_return_temp).state) && id(${id_prefix}zone_1_return_temp).state > 0) count++;
      if (!std::isnan(id(${id_prefix}zone_2_return_temp).state) && id(${id_prefix}zone_2_return_temp).state > 0) count++;
      if (!std::isnan(id(${id_prefix}zone_3_return_temp).state) && id(${id_prefix}zone_3_return_temp).state > 0) count++;
      if (!std::isnan(id(${id_prefix}zone_4_return_temp).state) && id(${id_prefix}zone_4_return_temp).state > 0) count++;
      if (!std::isnan(id(${id_prefix}zone_5_return_temp).state) && id(${id_prefix}zone_5_return_temp).state > 0) count++;
      if (!std::isnan(id(${id_prefix}zone_6_return_temp).state) && id(${id_prefix}zone_6_return_temp).state > 0) count++;
      if (!std::isnan(id(${id_prefix}zone_7_return_temp).state) && id(${id_prefix}zone_7_return_temp).state > 0) count++;
      if (!std::isnan(id(${id_prefix}zone_8_return_temp).state) && id(${id_prefix}zone_8_return_temp).state > 0) count++;
      return count;
