# ============================================
# ESP32-S3 Super Mini Board Configuration
# ============================================
# Hardware: ESP32-S3 Super Mini + TB6612FNG Motor Driver
# Motor control: Multiplexed design with current-based endstop detection
#
# TB6612FNG Module 1:
#   AO1 -> OUT.P.0 (Motor 1+)    AO2 -> OUT.P.1 (Motor 2+)
#   BO1 -> OUT.P.3 (Motor 4+)    BO2 -> OUT.P.2 (Motor 3+)
#   PWMA -> GPIO2 (Enable 0)     PWMB -> GPIO3 (Enable 1)
#
# TB6612FNG Module 2:
#   AO1 -> OUT.P.4 (Motor 5+)    AO2 -> OUT.P.5 (Motor 6+)
#   BO1 -> OUT.P.7 (Motor 8+)    BO2 -> OUT.P.6 (Motor 7+)
#   PWMA -> GPIO4 (Enable 2)     PWMB -> GPIO5 (Enable 3)
#
# Motor Negative (via GAQY212GSX optocouplers):
#   N1 = Odd motors (1,3,5,7)  when Mux=HIGH
#   N2 = Even motors (2,4,6,8) when Mux=LOW
#
# NOTE: Only ONE motor can run at a time due to multiplexing!

esphome:
  name: ${name}
  on_boot:
    - priority: 600  # Early boot - show blue LED
      then:
        - script.execute: led_status_boot
    - priority: -200  # Late boot - start maintenance
      then:
        - delay: ${onboot_valve_calibration_delay}
        - script.execute: valve_maintenance

  project:
    name: "birkemosen.floor-heating-controller"
    version: "${revision}.dev"
  platformio_options:
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio
    board_build.flash_size: 4MB

substitutions:
  # Board and compilation
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework: esp-idf

  # ============================================
  # TB6612FNG Motor Driver Pins
  # ============================================
  # Control pins
  tb6612_mux_pin: GPIO1       # Mux: HIGH=N1 (odd motors), LOW=N2 (even motors)
  tb6612_dir1_pin: GPIO6      # Direction AIN1/BIN1: HIGH=open, LOW=close
  tb6612_dir2_pin: GPIO9      # Direction AIN2/BIN2: inverted by software (was I2C SCL)
  tb6612_stby_pin: GPIO7      # Standby: HIGH=active, LOW=standby
  
  # Enable pins (one per motor pair)
  tb6612_ena0_pin: GPIO2      # Motors 1 & 2 (TB6612#1 PWMA)
  tb6612_ena1_pin: GPIO3      # Motors 3 & 4 (TB6612#1 PWMB) - WARNING: Strapping pin!
  tb6612_ena2_pin: GPIO4      # Motors 5 & 6 (TB6612#2 PWMA)
  tb6612_ena3_pin: GPIO5      # Motors 7 & 8 (TB6612#2 PWMB)
  
  # ============================================
  # BEMF / Current Sensing Pins
  # ============================================
  adc_current_pin: GPIO10     # Motor current sensing (ADC)
  tacho_pin: GPIO11           # Tacho input for revolution counting
  adc_ref_pin: GPIO12         # Reference voltage for current measurement
  
  # ============================================
  # Spare Pins
  # ============================================
  # i2c_sda_pin: GPIO8        # Free (was I2C SDA)
  # uart_tx_pin: GPIO43       # UART0 TX (active on Super Mini)
  # uart_rx_pin: GPIO44       # UART0 RX (active on Super Mini)
  # GPIO9 is now used for tb6612_dir2_pin
  
  # ============================================
  # Other Pins
  # ============================================
  onewire_pin: GPIO13         # Dallas 1-Wire bus
  status_led_pin: GPIO48      # WS2812 RGB LED

esp32:
  board: ${board}
  variant: ${variant}
  framework:
    type: ${framework}
    version: recommended
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y

preferences:
  flash_write_interval: 0s  # Write to flash immediately on change

ota:
  - platform: esphome

safe_mode:

# ============================================
# Status LED (WS2812 RGB with status colors)
# ============================================
# Color codes:
#   GREEN (solid)     = Normal, connected to Home Assistant
#   GREEN (breathing) = Normal, standalone mode
#   BLUE (flashing)   = Booting / WiFi connecting
#   CYAN (solid)      = Motor running
#   YELLOW (solid)    = Warning (temp sensor offline)
#   ORANGE (flashing) = No 1-Wire sensors found
#   RED (solid)       = Error (API disconnected + standalone off)
#   RED (flashing)    = Critical error (motor stall/overcurrent)
#   PURPLE (solid)    = Calibration in progress
#   WHITE (flash)     = Command received

# Status tracking global
globals:
  - id: led_status_code
    type: int
    restore_value: no
    initial_value: '0'  # 0=boot, 1=ok, 2=standalone, 3=motor, 4=warning, 5=error, 6=critical, 7=calibrating

light:
  - platform: esp32_rmt_led_strip
    name: "${name} Status LED"
    id: ${id_prefix}status_led
    icon: "mdi:alarm-light"
    rgb_order: GRB
    pin: ${status_led_pin}
    num_leds: 1
    chipset: ws2812
    restore_mode: ALWAYS_OFF
    entity_category: config
    effects:
      - pulse:
          name: "Breathing"
          transition_length: 2s
          update_interval: 2s
          min_brightness: 10%
          max_brightness: 40%
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms
      - strobe:
          name: "Slow Blink"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 500ms

# ============================================
# Status LED Control Scripts
# ============================================
script:
  # Boot/connecting - Blue flashing
  - id: led_status_boot
    then:
      - lambda: id(led_status_code) = 0;
      - light.turn_on:
          id: ${id_prefix}status_led
          brightness: 40%
          red: 0%
          green: 0%
          blue: 100%
          effect: "Fast Blink"

  # Normal connected - Green solid
  - id: led_status_ok
    then:
      - lambda: id(led_status_code) = 1;
      - light.turn_on:
          id: ${id_prefix}status_led
          brightness: 30%
          red: 0%
          green: 100%
          blue: 0%
          effect: "None"

  # Standalone mode - Green breathing
  - id: led_status_standalone
    then:
      - lambda: id(led_status_code) = 2;
      - light.turn_on:
          id: ${id_prefix}status_led
          brightness: 30%
          red: 0%
          green: 100%
          blue: 0%
          effect: "Breathing"

  # Motor running - Cyan solid
  - id: led_status_motor
    then:
      - lambda: id(led_status_code) = 3;
      - light.turn_on:
          id: ${id_prefix}status_led
          brightness: 50%
          red: 0%
          green: 100%
          blue: 100%
          effect: "None"

  # Warning - Yellow solid
  - id: led_status_warning
    then:
      - lambda: id(led_status_code) = 4;
      - light.turn_on:
          id: ${id_prefix}status_led
          brightness: 40%
          red: 100%
          green: 70%
          blue: 0%
          effect: "None"

  # Error - Red solid
  - id: led_status_error
    then:
      - lambda: id(led_status_code) = 5;
      - light.turn_on:
          id: ${id_prefix}status_led
          brightness: 50%
          red: 100%
          green: 0%
          blue: 0%
          effect: "None"

  # Critical error - Red flashing
  - id: led_status_critical
    then:
      - lambda: id(led_status_code) = 6;
      - light.turn_on:
          id: ${id_prefix}status_led
          brightness: 80%
          red: 100%
          green: 0%
          blue: 0%
          effect: "Fast Blink"

  # Calibration - Purple solid
  - id: led_status_calibrating
    then:
      - lambda: id(led_status_code) = 7;
      - light.turn_on:
          id: ${id_prefix}status_led
          brightness: 50%
          red: 80%
          green: 0%
          blue: 100%
          effect: "None"

  # Flash white (command received) - returns to previous state
  - id: led_flash_command
    then:
      - lambda: |-
          int prev = id(led_status_code);
      - light.turn_on:
          id: ${id_prefix}status_led
          brightness: 100%
          red: 100%
          green: 100%
          blue: 100%
          effect: "None"
      - delay: 100ms
      - script.execute: led_update_status

  # Update LED based on current system status
  - id: led_update_status
    then:
      - lambda: |-
          // Check conditions in priority order
          
          // Motor running - highest visual priority
          if (id(motor_turning)) {
            id(led_status_motor).execute();
            return;
          }
          
          // Check WiFi and API status
          bool wifi_ok = wifi::global_wifi_component->is_connected();
          bool api_ok = api_is_connected();
          
          // Not connected to WiFi
          if (!wifi_ok) {
            id(led_status_boot).execute();
            return;
          }
          
          // WiFi OK but API not connected
          if (!api_ok) {
            // Check if standalone mode is enabled
            if (id(${id_prefix}standalone_mode).state) {
              id(led_status_standalone).execute();
            } else {
              id(led_status_error).execute();
            }
            return;
          }
          
          // All OK - green
          id(led_status_ok).execute();

# ============================================
# Status LED Update Interval
# ============================================
interval:
  - interval: 2s
    then:
      - script.execute: led_update_status

# ============================================
# I2C Bus (disabled - GPIO9 used for motor direction)
# ============================================
# i2c:
#   sda: GPIO8
#   scl: GPIO9
#   scan: true

psram:
  mode: octal
  speed: 80MHz
