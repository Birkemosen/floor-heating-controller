# ============================================
# Floor Heating Controller - Example Config
# ============================================
# Complete 8-zone example using the modular structure.
# Copy this to your ESPHome config folder and customize.
#
# For flashing: press BOOT button for 2-3 seconds before serial init
# After OTA update: press EN (reset) button to run firmware
# Do not use GPIO12 (MTDI)

# Temporary fix for ADC library (https://github.com/esphome/issues/issues/6455)
external_components:
  - source: github://pr#9021 #https://github.com/esphome/esphome/pull/9021
    refresh: 30s
    components:
      - adc

# ============================================
# General Configuration
# ============================================
substitutions:
  name: floor-heating-controller
  friendly_name: "Floor Heating"
  id_prefix: "heating_"
  revision: "2.0.0"
  
  # Multi-controller configuration
  controller_id: "1"  # Change to "2" for second controller
  total_controllers: "2"  # Total number of controllers in the system
    
  #time
  TZ: "Europe/Zurich" #timezone
  reboot_days_of_week: "MON"
  reboot_hours: "5"
  reboot_minutes: "0"
  reboot_seconds: "0"
  onboot_valve_calibration_delay: "1min"
  
  # Valve maintenance (exercise valves to prevent sticking)
  # Set to "0s" to disable periodic maintenance
  valve_maintenance_interval: "7d"  # 7 days
  
  # Dallas temperature sensors (run 1-wire scan to get addresses)
  dallasaddress_input: "0xb300000084aa6128"
  dallasaddress_output: "0xeb0000008492ad28"
  
  adc_zero_calibration: "-0.075"
  pump_mac_address: "AA:BB:CC:DD:EE:FF"
  
  # ============================================
  # CONTROL PROFILE: Set globally here
  # Options: zones/tanh.yaml, zones/linear.yaml,
  #          zones/pid.yaml, zones/remote.yaml
  # ============================================
  control_profile: "zones/tanh.yaml"

# ============================================
# Web Server with Sorting Groups
# ============================================
web_server:
  port: 80
  version: 3
  log: true
  sorting_groups:
    - id: sorting_group_climate
      name: "Climate"
      sorting_weight: 1
    - id: sorting_group_sensors
      name: "Sensors"
      sorting_weight: 2
    - id: sorting_group_actions
      name: "Actions"
      sorting_weight: 3
    - id: sorting_group_covers
      name: "Manual Covers"
      sorting_weight: 40
    - id: sorting_group_BEMF
      name: "Debug: BEMF"
      sorting_weight: 50
    - id: sorting_group_inputs
      name: "Debug: Inputs"
      sorting_weight: 60

api:
  reboot_timeout: 30min

# ============================================
# Valve Maintenance
# ============================================
script:
  - id: valve_maintenance
    then:
      - logger.log: "Valve maintenance"
      - script.execute: calibrate_CH1_cover
      - delay: 300s
      - script.execute: calibrate_CH2_cover
      - delay: 300s
      - script.execute: calibrate_CH3_cover
      - delay: 300s
      - script.execute: calibrate_CH4_cover
      - delay: 300s
      - script.execute: calibrate_CH5_cover
      - delay: 300s
      - script.execute: calibrate_CH6_cover
      - delay: 300s
      - script.execute: calibrate_CH7_cover
      - delay: 300s
      - script.execute: calibrate_CH8_cover

# ============================================
# Packages
# ============================================
packages:
  # Board (uncomment one)
  board: !include boards/esp32.yaml
  # board: !include boards/esp32-s3.yaml
  # board: !include boards/esp32-c3.yaml
  
  # Core infrastructure
  core_settings: !include core/settings.yaml
  logger: !include core/logger.yaml
  sn74hc595: !include core/sn74hc595.yaml
  wifi: !include core/wifi.yaml
  time: !include core/time.yaml
  switch_others: !include core/switch_others.yaml
  inputs: !include core/inputs.yaml
  sensor_adc: !include core/sensor_adc.yaml
  sensor_others: !include core/sensor_others.yaml
  onewire: !include core/onewire.yaml

  # ============================================
  # MODE: Uncomment for hydraulic balancing
  # ============================================
  # hydraulic: !include modes/hydraulic.yaml

  # ============================================
  # Optional: Pump control via ESP-NOW
  # ============================================
  pump_control: !include
    file: optional/pump_control.yaml
    vars:
      pump_mac_address: ${pump_mac_address}
      circulation_check_interval: "24h"
      circulation_run_duration: "5min"

  # ============================================
  # Optional: MQTT Ecodan integration
  # ============================================
  # mqtt_ecodan: !include optional/mqtt_ecodan.yaml

  # ============================================
  # ZONES: All use ${control_profile}
  # ============================================
  zone_1: !include
    file: ${control_profile}
    vars:
      zone_number: "1"
      id: wc
      friendly_name: "WC"
      temperature_sensor: corridor_temp
      bemf_trigger_initial: "0.650"
      zone_area_default: "4"
      zone_max_opening_default: "90"
      bemf_sensor_adc: BEMF_1_2_sensor_ADC
      bemf_linked_channel: "2"
      sn74hc595_IA_pin: "0"
      sn74hc595_IB_pin: "1"
      default_preset: HOME
      preset_home_temp: "21 °C"
      preset_away_temp: "19 °C"
      preset_boost_temp: "23 °C"
      check_interval: "15min"
      tanh_steepness: "0.70"

  zone_2: !include
    file: ${control_profile}
    vars:
      zone_number: "2"
      id: storage
      friendly_name: "Storage"
      temperature_sensor: storage_temp
      bemf_trigger_initial: "0.650"
      zone_area_default: "6"
      zone_max_opening_default: "90"
      bemf_sensor_adc: BEMF_1_2_sensor_ADC
      bemf_linked_channel: "1"
      sn74hc595_IA_pin: "2"
      sn74hc595_IB_pin: "3"
      default_preset: HOME
      preset_home_temp: "21 °C"
      preset_away_temp: "19 °C"
      preset_boost_temp: "23 °C"
      check_interval: "16min"
      tanh_steepness: "0.70"

  zone_3: !include
