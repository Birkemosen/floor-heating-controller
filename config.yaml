# ============================================
# Floor Heating Controller - Example Config
# ============================================
# Complete 8-zone example.
#
# SETUP: Clone this repo to floor-heating/ subfolder:
#   /config/
#   ├── config.yaml        (copy this file here)
#   ├── secrets.yaml
#   └── floor-heating/     (this repo)
#
# For flashing: press BOOT button for 2-3 seconds before serial init
# After OTA update: press EN (reset) button to run firmware
# Do not use GPIO12 (MTDI)

# Temporary fix for ADC library (https://github.com/esphome/issues/issues/6455)
external_components:
  - source: github://pr#9021 #https://github.com/esphome/esphome/pull/9021
    refresh: 30s
    components:
      - adc

# ============================================
# General Configuration
# ============================================
substitutions:
  name: floor-heating-controller
  friendly_name: "Floor Heating"
  id_prefix: "heating_"
  revision: "2.0.0"
   
  # Multi-controller configuration
  controller_id: "1"  # Change to "2" for second controller
  total_controllers: "2"  # Total number of controllers in the system
    
  #time
  TZ: "Europe/Zurich" #timezone
  reboot_days_of_week: "MON"
  reboot_hours: "5"
  reboot_minutes: "0"
  reboot_seconds: "0"
  onboot_valve_calibration_delay: "1min"
  
  # Valve maintenance (exercise valves to prevent sticking)
  # Set to "0s" to disable periodic maintenance
  valve_maintenance_interval: "7d"  # 7 days
  
  # Dallas temperature sensors (run 1-wire scan to get addresses)
  dallasaddress_input: "0xb300000084aa6128"
  dallasaddress_output: "0xeb0000008492ad28"
  
  adc_zero_calibration: "-0.075"
  pump_mac_address: "AA:BB:CC:DD:EE:FF"
  
  # ============================================
  # CONTROL PROFILE
  # ============================================
  # NOTE: ESPHome does not support substitutions in !include paths.
  # To change control profile, manually replace the path in all zone includes below.
  # Options:
  #   floor-heating/zones/tanh.yaml   (default)
  #   floor-heating/zones/linear.yaml
  #   floor-heating/zones/pid.yaml
  #   floor-heating/zones/remote.yaml

# ============================================
# Web Server
# ============================================
web_server:
  port: 80
  version: 3
  log: true
  sorting_groups:
    - id: sorting_group_climate
      name: "Climate"
      sorting_weight: 10
    - id: sorting_group_settings
      name: "Settings"
      sorting_weight: 20
    - id: sorting_group_status
      name: "Status"
      sorting_weight: 30
    - id: sorting_group_zones
      name: "Zone Parameters"
      sorting_weight: 40
    - id: sorting_group_covers
      name: "Manual Covers"
      sorting_weight: 50
    - id: sorting_group_debug
      name: "Debug"
      sorting_weight: 90

api:
  reboot_timeout: 30min

# ============================================
# WiFi Configuration
# ============================================
# Configure directly here or use: wifi: !include floor-heating/core/wifi.yaml
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  # Additional networks (optional):
  # - ssid: !secret wifi_ssid_2
  #   password: !secret wifi_password_2
  #   priority: 2
  ap:
    ssid: "UFH_Fallback"
    password: !secret fallback_password

captive_portal:

ota:
  platform: esphome
  password: !secret ota_password

# ============================================
# Valve Maintenance
# ============================================
script:
  - id: valve_maintenance
    then:
      - logger.log: "Valve maintenance"
      - script.execute: calibrate_CH1_cover
      - delay: 300s
      - script.execute: calibrate_CH2_cover
      - delay: 300s
      - script.execute: calibrate_CH3_cover
      - delay: 300s
      - script.execute: calibrate_CH4_cover
      - delay: 300s
      - script.execute: calibrate_CH5_cover
      - delay: 300s
      - script.execute: calibrate_CH6_cover
      - delay: 300s
      - script.execute: calibrate_CH7_cover
      - delay: 300s
      - script.execute: calibrate_CH8_cover

# ============================================
# Packages
# ============================================
packages:
  # Language / Localization (en = English, da = Danish)
  language: !include floor-heating/i18n/da.yaml
  # language: !include floor-heating/i18n/en.yaml

  # Board
  board: !include floor-heating/boards/esp32.yaml
  # board: !include floor-heating/boards/esp32-s3.yaml
  # board: !include floor-heating/boards/esp32-c3.yaml
  
  # Core infrastructure
  core_settings: !include floor-heating/core/settings.yaml
  logger: !include floor-heating/core/logger.yaml
  sn74hc595: !include floor-heating/core/sn74hc595.yaml
  time: !include floor-heating/core/time.yaml
  switch_others: !include floor-heating/core/switch_others.yaml
  sensor_adc: !include floor-heating/core/sensor_adc.yaml
  sensor_others: !include floor-heating/core/sensor_others.yaml
  onewire: !include floor-heating/core/onewire.yaml

  # ============================================
  # MODE: Uncomment for hydraulic balancing
  # ============================================
  # hydraulic: !include floor-heating/modes/hydraulic.yaml

  # ============================================
  # Optional: Pump control via ESP-NOW
  # ============================================
  pump_control: !include
    file: floor-heating/optional/pump_control.yaml
    vars:
      pump_mac_address: ${pump_mac_address}
      circulation_check_interval: "24h"
      circulation_run_duration: "5min"

  # ============================================
  # Optional: MQTT Ecodan integration
  # ============================================
  # mqtt_ecodan: !include floor-heating/optional/mqtt_ecodan.yaml

  # ============================================
  # ZONES
  # ============================================
  # Control profile options (use same for all zones):
  #   floor-heating/zones/tanh.yaml   - Smooth tanh curve control
  #   floor-heating/zones/linear.yaml - Linear proportional control
  #   floor-heating/zones/pid.yaml    - PID control with auto-tune
  #   floor-heating/zones/remote.yaml - External/Home Assistant control
  
  zone_1: !include
    file: floor-heating/zones/tanh.yaml
    # file: floor-heating/zones/linear.yaml
    # file: floor-heating/zones/pid.yaml
    # file: floor-heating/zones/remote.yaml
    vars:
      zone_number: "1"
      id: wc
      friendly_name: "WC"
      temperature_sensor: corridor_temp
      bemf_trigger_initial: "0.650"
      zone_area_default: "4"
      zone_max_opening_default: "90"
      bemf_sensor_adc: BEMF_1_2_sensor_ADC
      bemf_linked_channel: "2"
      sn74hc595_IA_pin: "0"
      sn74hc595_IB_pin: "1"
      default_preset: HOME
      preset_home_temp: "21 °C"
      preset_away_temp: "19 °C"
      preset_boost_temp: "23 °C"
      check_interval: "15min"
      tanh_steepness: "0.70"

  zone_2: !include
    file: floor-heating/zones/tanh.yaml
    # file: floor-heating/zones/linear.yaml
    # file: floor-heating/zones/pid.yaml
    # file: floor-heating/zones/remote.yaml
    vars:
      zone_number: "2"
