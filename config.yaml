# ============================================
# TEMPERATURE SENSORS
# ============================================
# Choose sensor type based on your setup.
# The sensor ID must match the zone's temperature_sensor variable.

sensor:
  # ============================================
  # Option 1: Home Assistant sensors (recommended)
  # Uses existing sensors from Home Assistant
  # ============================================
  - platform: homeassistant
    name: "Corridor Temperature"
    entity_id: sensor.corridor_temperature
    id: corridor_temp

  - platform: homeassistant
    name: "Storage Temperature"
    entity_id: sensor.storage_temperature
    id: storage_temp

  - platform: homeassistant
    name: "Living Room Temperature"
    entity_id: sensor.living_room_temperature
    id: living_temp

  - platform: homeassistant
    name: "Office Temperature"
    entity_id: sensor.office_temperature
    id: office_temp

  - platform: homeassistant
    name: "Bedroom Temperature"
    entity_id: sensor.bedroom_temperature
    id: bedroom_temp

  - platform: homeassistant
    name: "Bathroom Temperature"
    entity_id: sensor.bathroom_temperature
    id: bathroom_temp

  # ============================================
  # Option 2: Dallas/OneWire DS18B20 sensors
  # Requires onewire component (included in core)
  # Run "esphome logs config.yaml" to get addresses
  # ============================================
  # - platform: dallas_temp
  #   address: 0x1234567890abcdef
  #   name: "Living Room Temperature"
  #   id: living_temp
  #   resolution: 12
  #   accuracy_decimals: 1
  #   filters:
  #     - offset: 0.0

  # ============================================
  # Option 3: DHT22/DHT11/AM2302 sensors
  # Direct GPIO connection
  # ============================================
  # - platform: dht
  #   model: DHT22  # or DHT11, AM2302
  #   pin: GPIO25
  #   temperature:
  #     name: "Living Room Temperature"
  #     id: living_temp
  #   humidity:
  #     name: "Living Room Humidity"
  #   update_interval: 30s

  # ============================================
  # Option 4: BLE Xiaomi sensors (via ESP32 BLE)
  # Requires esp32_ble_tracker component
  # ============================================
  # esp32_ble_tracker:
  #
  # - platform: xiaomi_lywsdcgq
  #   mac_address: "58:2D:34:37:F1:10"
  #   temperature:
  #     name: "Living Room Temperature"
  #     id: living_temp
  #   humidity:
  #     name: "Living Room Humidity"
  #   battery_level:
  #     name: "Living Room Sensor Battery"

  # ============================================
  # Option 5: BLE Xiaomi via Home Assistant
  # When BLE sensors are in HA via another integration
  # ============================================
  # - platform: homeassistant
  #   name: "Living Room Temperature"
  #   entity_id: sensor.ble_xiaomi_living_temperature
  #   id: living_temp

  # ============================================
  # Option 6: SHT3x/SHT4x I2C sensors
  # Requires i2c component
  # ============================================
  # i2c:
  #   sda: GPIO21
  #   scl: GPIO22
  #
  # - platform: sht3xd
  #   temperature:
  #     name: "Living Room Temperature"
  #     id: living_temp
  #   humidity:
  #     name: "Living Room Humidity"
  #   address: 0x44
  #   update_interval: 30s

  # ============================================
  # Option 7: BME280/BMP280 I2C sensors
  # ============================================
  # - platform: bme280_i2c
  #   temperature:
  #     name: "Living Room Temperature"
  #     id: living_temp
  #   humidity:
  #     name: "Living Room Humidity"
  #   pressure:
  #     name: "Living Room Pressure"
  #   address: 0x76
  #   update_interval: 30s
