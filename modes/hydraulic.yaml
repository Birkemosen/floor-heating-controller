# ============================================
# Dynamic Hydraulic Balancing Algorithm
# ============================================
# Implements combined hydraulic + thermal demand balancing
# Based on return temperature method and pipe length ratios
#
# Key features:
# - Zone classification: OVERHEATED, SATISFIED, DEMAND
# - Dynamic reference zone selection (longest pipe among active zones)
# - UFH thermal lag compensation (comfort band)
# - Hysteresis to prevent oscillation
# - Return temperature feedback for fine-tuning
#
# Zone States:
#   OVERHEATED (0): temp > setpoint + comfort_band -> close valve
#   SATISFIED (1):  temp within ±comfort_band -> maintenance flow
#   DEMAND (2):     temp < setpoint - comfort_band -> full heating

globals:
  # Zone states (0=OVERHEATED, 1=SATISFIED, 2=DEMAND)
  - id: ${id_prefix}zone_1_state
    type: int
    restore_value: no
    initial_value: '1'
  - id: ${id_prefix}zone_2_state
    type: int
    restore_value: no
    initial_value: '1'
  - id: ${id_prefix}zone_3_state
    type: int
    restore_value: no
    initial_value: '1'
  - id: ${id_prefix}zone_4_state
    type: int
    restore_value: no
    initial_value: '1'
  - id: ${id_prefix}zone_5_state
    type: int
    restore_value: no
    initial_value: '1'
  - id: ${id_prefix}zone_6_state
    type: int
    restore_value: no
    initial_value: '1'
  - id: ${id_prefix}zone_7_state
    type: int
    restore_value: no
    initial_value: '1'
  - id: ${id_prefix}zone_8_state
    type: int
    restore_value: no
    initial_value: '1'
  
  # Previous overheated state for hysteresis
  - id: ${id_prefix}zone_1_was_overheated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ${id_prefix}zone_2_was_overheated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ${id_prefix}zone_3_was_overheated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ${id_prefix}zone_4_was_overheated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ${id_prefix}zone_5_was_overheated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ${id_prefix}zone_6_was_overheated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ${id_prefix}zone_7_was_overheated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ${id_prefix}zone_8_was_overheated
    type: bool
    restore_value: no
    initial_value: 'false'
  
  # Hydraulic adjustment factors per zone (applied to thermal demand position)
  - id: ${id_prefix}zone_1_hydraulic_factor
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: ${id_prefix}zone_2_hydraulic_factor
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: ${id_prefix}zone_3_hydraulic_factor
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: ${id_prefix}zone_4_hydraulic_factor
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: ${id_prefix}zone_5_hydraulic_factor
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: ${id_prefix}zone_6_hydraulic_factor
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: ${id_prefix}zone_7_hydraulic_factor
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: ${id_prefix}zone_8_hydraulic_factor
    type: float
    restore_value: yes
    initial_value: '1.0'
  
  # Reference zone tracking
  - id: ${id_prefix}reference_zone
    type: int
    restore_value: no
    initial_value: '0'
  - id: ${id_prefix}reference_pipe_length
    type: float
    restore_value: no
    initial_value: '100.0'

# ============================================
# Configurable Parameters (Web UI)
# ============================================
number:
  - platform: template
    name: "Minimum Valve Opening"
    id: ${id_prefix}minimum_valve_opening
    icon: "mdi:valve"
    unit_of_measurement: "%"
    optimistic: true
    min_value: 10
    max_value: 50
    step: 1
    restore_value: true
    initial_value: 25
    
  - platform: template
    name: "Maintenance Base"
    id: ${id_prefix}maintenance_base
    icon: "mdi:tune"
    unit_of_measurement: "%"
    optimistic: true
    min_value: 30
    max_value: 60
    step: 1
    restore_value: true
    initial_value: 45
    
  - platform: template
    name: "Demand Boost"
    id: ${id_prefix}demand_boost
    icon: "mdi:rocket-launch"
    unit_of_measurement: "%"
    optimistic: true
    min_value: 0
    max_value: 50
    step: 1
    restore_value: true
    initial_value: 30
    
  - platform: template
    name: "Comfort Band"
    id: ${id_prefix}comfort_band
    icon: "mdi:thermometer-lines"
    unit_of_measurement: "°C"
    optimistic: true
    min_value: 0.3
    max_value: 1.0
    step: 0.1
    restore_value: true
    initial_value: 0.5
    
  - platform: template
    name: "Balancing Interval"
    id: ${id_prefix}balancing_interval
    icon: "mdi:timer-outline"
    unit_of_measurement: "min"
    optimistic: true
    min_value: 1
    max_value: 30
    step: 1
    restore_value: true
    initial_value: 5
    
  - platform: template
    name: "Balancing Step"
    id: ${id_prefix}balancing_step
    icon: "mdi:stairs"
    unit_of_measurement: "%"
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    restore_value: true
    initial_value: 3

# Note: balancing_enabled switch is defined in core/settings.yaml
# This file enables it at boot via esphome on_boot

esphome:
  on_boot:
    priority: -100  # Run after other on_boot handlers
    then:
      - switch.turn_on: ${id_prefix}balancing_enabled
      - logger.log: "Hydraulic balancing enabled"

# ============================================
# Additional Status Sensors
# ============================================
sensor:
  - platform: template
    name: "Reference Zone"
    id: ${id_prefix}reference_zone_sensor
    icon: "mdi:target"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return id(${id_prefix}reference_zone);

text_sensor:
  - platform: template
    name: "Balancing Status"
    id: ${id_prefix}balancing_status
    icon: "mdi:information-outline"
    update_interval: 30s
    lambda: |-
      if (!id(${id_prefix}balancing_enabled).state) {
        return {"Disabled"};
      }
      
      float avg = id(${id_prefix}avg_valve_position).state;
      if (avg < 30) {
        return {"Low demand - request lower flow temp"};
      } else if (avg > 90) {
        return {"High demand - request higher flow temp"};
      } else if (avg >= 50 && avg <= 80) {
        return {"Optimal range (50-80%)"};
      }
      return {"Balancing active"};

# ============================================
# Hydraulic Balancing Script
# ============================================
script:
  - id: ${id_prefix}hydraulic_balancing_check
    mode: single
    then:
      - lambda: |-
          if (!id(${id_prefix}balancing_enabled).state) {
            ESP_LOGD("hydraulic", "Balancing disabled, skipping");
            return;
          }
          
          ESP_LOGI("hydraulic", "Running hydraulic balancing check");
          
          float comfort_band = id(${id_prefix}comfort_band).state;
          float maintenance_base = id(${id_prefix}maintenance_base).state / 100.0;
          float demand_boost = id(${id_prefix}demand_boost).state / 100.0;
          float min_opening = id(${id_prefix}minimum_valve_opening).state / 100.0;
          float balancing_step = id(${id_prefix}balancing_step).state / 100.0;
          
          // Zone data arrays (pipe_length from zone parameters, 0 = not configured)
          float pipe_lengths[8] = {
            id(${id_prefix}zone_1_pipe_length).state,
            id(${id_prefix}zone_2_pipe_length).state,
            id(${id_prefix}zone_3_pipe_length).state,
            id(${id_prefix}zone_4_pipe_length).state,
            id(${id_prefix}zone_5_pipe_length).state,
            id(${id_prefix}zone_6_pipe_length).state,
            id(${id_prefix}zone_7_pipe_length).state,
            id(${id_prefix}zone_8_pipe_length).state
          };
          
          float max_openings[8] = {
            id(${id_prefix}zone_1_max_opening).state / 100.0,
            id(${id_prefix}zone_2_max_opening).state / 100.0,
            id(${id_prefix}zone_3_max_opening).state / 100.0,
            id(${id_prefix}zone_4_max_opening).state / 100.0,
            id(${id_prefix}zone_5_max_opening).state / 100.0,
            id(${id_prefix}zone_6_max_opening).state / 100.0,
            id(${id_prefix}zone_7_max_opening).state / 100.0,
            id(${id_prefix}zone_8_max_opening).state / 100.0
          };
          
          int* zone_states[8] = {
            &id(${id_prefix}zone_1_state),
            &id(${id_prefix}zone_2_state),
            &id(${id_prefix}zone_3_state),
            &id(${id_prefix}zone_4_state),
            &id(${id_prefix}zone_5_state),
            &id(${id_prefix}zone_6_state),
            &id(${id_prefix}zone_7_state),
            &id(${id_prefix}zone_8_state)
          };
          
          bool* was_overheated[8] = {
            &id(${id_prefix}zone_1_was_overheated),
            &id(${id_prefix}zone_2_was_overheated),
            &id(${id_prefix}zone_3_was_overheated),
            &id(${id_prefix}zone_4_was_overheated),
            &id(${id_prefix}zone_5_was_overheated),
            &id(${id_prefix}zone_6_was_overheated),
            &id(${id_prefix}zone_7_was_overheated),
            &id(${id_prefix}zone_8_was_overheated)
          };
          
          float* hydraulic_factors[8] = {
            &id(${id_prefix}zone_1_hydraulic_factor),
            &id(${id_prefix}zone_2_hydraulic_factor),
            &id(${id_prefix}zone_3_hydraulic_factor),
            &id(${id_prefix}zone_4_hydraulic_factor),
            &id(${id_prefix}zone_5_hydraulic_factor),
            &id(${id_prefix}zone_6_hydraulic_factor),
            &id(${id_prefix}zone_7_hydraulic_factor),
            &id(${id_prefix}zone_8_hydraulic_factor)
          };
          
          // Step 1: Find reference zone (longest pipe among non-overheated zones)
          float max_pipe_length = 0;
          int ref_zone = -1;
          
          for (int i = 0; i < 8; i++) {
            if (pipe_lengths[i] > 0 && *zone_states[i] != 0) {  // 0 = OVERHEATED
              if (pipe_lengths[i] > max_pipe_length) {
                max_pipe_length = pipe_lengths[i];
                ref_zone = i;
              }
            }
          }
          
          id(${id_prefix}reference_zone) = ref_zone + 1;  // 1-indexed for display
          id(${id_prefix}reference_pipe_length) = max_pipe_length;
          
          if (ref_zone < 0) {
            ESP_LOGW("hydraulic", "All zones overheated or no pipe data - closing all valves");
            // Request lower flow temperature via MQTT would happen here
            return;
          }
          
          ESP_LOGD("hydraulic", "Reference zone: %d, pipe length: %.1fm", ref_zone + 1, max_pipe_length);
          
          // Step 2: Calculate hydraulic factors for each zone
          for (int i = 0; i < 8; i++) {
            if (pipe_lengths[i] <= 0) continue;  // Skip unconfigured zones
            
            float pipe_ratio = pipe_lengths[i] / max_pipe_length;
            
            if (*zone_states[i] == 0) {
              // OVERHEATED - factor 0 (close valve)
              *hydraulic_factors[i] = 0.0;
              ESP_LOGD("hydraulic", "Zone %d: OVERHEATED, factor=0", i + 1);
            }
            else if (*zone_states[i] == 1) {
              // SATISFIED - maintenance mode with hydraulic ratio
              *hydraulic_factors[i] = (maintenance_base * pipe_ratio);
              if (*hydraulic_factors[i] < min_opening) {
                *hydraulic_factors[i] = min_opening;
              }
              ESP_LOGD("hydraulic", "Zone %d: SATISFIED, ratio=%.2f, factor=%.2f", i + 1, pipe_ratio, *hydraulic_factors[i]);
            }
            else {
              // DEMAND - boosted hydraulic base
              float base = max_openings[i] * pipe_ratio;
              // demand_factor would come from the climate entity, simplified here
              *hydraulic_factors[i] = base * (1.0 + demand_boost);
              if (*hydraulic_factors[i] > 1.0) *hydraulic_factors[i] = 1.0;
              if (*hydraulic_factors[i] < min_opening) *hydraulic_factors[i] = min_opening;
              ESP_LOGD("hydraulic", "Zone %d: DEMAND, base=%.2f, factor=%.2f", i + 1, base, *hydraulic_factors[i]);
            }
          }
          
          ESP_LOGI("hydraulic", "Balancing check complete");

# ============================================
# Periodic Balancing Interval
# ============================================
interval:
  - interval: 5min
    then:
      - script.execute: ${id_prefix}hydraulic_balancing_check
