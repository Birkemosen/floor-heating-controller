# ============================================
# Standard Mode (no hydraulic balancing)
# ============================================
# In standard mode, each zone controls its valve position
# based purely on temperature difference using the selected
# control profile (tanh, PID, or linear).
#
# This file is optional - standard mode works without it.
# Include this file if you want to ensure balancing is disabled.

switch:
  - platform: template
    name: "Hydraulic Balancing"
    id: ${id_prefix}balancing_enabled
    icon: "mdi:scale-balance"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF  # OFF by default in standard mode

# Note: Zone templates already have fallback logic for when
# balancing_enabled is OFF - they use the pure control profile
# without hydraulic adjustments.
