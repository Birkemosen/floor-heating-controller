# ============================================
# Global Pipe Settings
# ============================================
  - platform: template
    name: "Pipe Spacing"
    id: ${id_prefix}pipe_spacing
    icon: "mdi:arrow-expand-horizontal"
    unit_of_measurement: "mm"
    optimistic: true
    min_value: 100
    max_value: 300
    step: 50
    restore_value: true
    initial_value: 150
    
  - platform: template
    name: "Pipe Volume per Meter"
    id: ${id_prefix}pipe_volume_per_meter
    icon: "mdi:pipe"
    unit_of_measurement: "L/m"
    optimistic: true
    min_value: 0.05
    max_value: 0.25
    step: 0.001
    restore_value: true
    initial_value: 0.113  # PEX 16x2

select:
  - platform: template
    name: "Pipe Type"
    id: ${id_prefix}pipe_type
    icon: "mdi:pipe"
    optimistic: true
    restore_value: true
    options:
      - "PEX 12x2"
      - "PEX 14x2"
      - "PEX 16x2"
      - "PEX 17x2"
      - "PEX 18x2"
      - "PEX 20x2"
      - "PERT 16x2"
      - "PERT 20x2"
    initial_option: "PEX 16x2"
    on_value:
      then:
        - lambda: |-
            float volume = 0.113;  // default PEX 16x2
            if (x == "PEX 12x2") volume = 0.050;
            else if (x == "PEX 14x2") volume = 0.079;
            else if (x == "PEX 16x2") volume = 0.113;
            else if (x == "PEX 17x2") volume = 0.133;
            else if (x == "PEX 18x2") volume = 0.154;
            else if (x == "PEX 20x2") volume = 0.201;
            else if (x == "PERT 16x2") volume = 0.113;
            else if (x == "PERT 20x2") volume = 0.201;
            
            auto call = id(${id_prefix}pipe_volume_per_meter).make_call();
            call.set_value(volume);
            call.perform();
            ESP_LOGD("zone_params", "Pipe type changed to %s, volume=%.3f L/m", x.c_str(), volume);

# ============================================
# Calculated Pipe Lengths (auto-updated)
# ============================================
sensor:
  - platform: template
    name: "Zone 1 Pipe Length"
    id: ${id_prefix}zone_1_pipe_length
    icon: "mdi:ruler"
    unit_of_measurement: "m"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      float area = id(${id_prefix}zone_1_area).state;
      float spacing = id(${id_prefix}pipe_spacing).state / 1000.0;  // mm to m
      if (spacing > 0) {
        return area / spacing;
      }
      return 0;

  - platform: template
    name: "Zone 2 Pipe Length"
    id: ${id_prefix}zone_2_pipe_length
    icon: "mdi:ruler"
    unit_of_measurement: "m"
    accuracy_decimals: 1
