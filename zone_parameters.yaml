      return id(${id_prefix}zone_1_pipe_length).state +
             id(${id_prefix}zone_2_pipe_length).state +
             id(${id_prefix}zone_3_pipe_length).state +
             id(${id_prefix}zone_4_pipe_length).state +
             id(${id_prefix}zone_5_pipe_length).state +
             id(${id_prefix}zone_6_pipe_length).state +
             id(${id_prefix}zone_7_pipe_length).state +
             id(${id_prefix}zone_8_pipe_length).state;

  # Total system volume
  - platform: template
    name: "Total System Volume"
    id: ${id_prefix}total_system_volume
    icon: "mdi:cup-water"
    unit_of_measurement: "L"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      float total_length = id(${id_prefix}total_pipe_length).state;
      float volume_per_m = id(${id_prefix}pipe_volume_per_meter).state;
      return total_length * volume_per_m;
