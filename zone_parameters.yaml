  # Total pipe length
  - platform: template
    name: "Total Pipe Length"
    id: ${id_prefix}total_pipe_length
    icon: "mdi:ruler"
    unit_of_measurement: "m"
    accuracy_decimals: 1
    update_interval: 60s
