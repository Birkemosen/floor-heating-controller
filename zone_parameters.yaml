# ============================================
# Zone Physical Parameters
# ============================================
# Optional configuration for each zone's physical properties
# Used to improve hydraulic balancing calculations
#
# Auto-calculated values:
#   pipe_length = zone_area / (pipe_spacing / 1000)
#   pipe_volume = pipe_length * volume_per_meter
#
# All parameters stored in flash and configurable via web UI

# ============================================
# Pipe Type Volume Constants (L/m)
# ============================================
# PEX 12x2: 0.050 L/m (inner dia 8mm)
# PEX 14x2: 0.079 L/m (inner dia 10mm)
# PEX 16x2: 0.113 L/m (inner dia 12mm) - most common
# PEX 17x2: 0.133 L/m (inner dia 13mm)
# PEX 18x2: 0.154 L/m (inner dia 14mm)
# PEX 20x2: 0.201 L/m (inner dia 16mm)

# ============================================
# Zone 1 Parameters
# ============================================
number:
  - platform: template
    name: "Zone 1 Area"
    id: ${id_prefix}zone_1_area
    icon: "mdi:floor-plan"
    unit_of_measurement: "m²"
    optimistic: true
    min_value: 1
    max_value: 100
    step: 0.5
    restore_value: true
    initial_value: 15
    
  - platform: template
    name: "Zone 1 Max Opening"
    id: ${id_prefix}zone_1_max_opening
    icon: "mdi:valve-open"
    unit_of_measurement: "%"
    optimistic: true
    min_value: 50
    max_value: 100
    step: 5
    restore_value: true
    initial_value: 90

