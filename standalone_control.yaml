# ============================================
# Standalone Control Mode
# ============================================
# Ensures the floor heating controller works without Home Assistant
# Provides fallback behavior when MQTT or external sensors are unavailable
#
# Features:
# - Minimum valve opening enforcement
# - Fallback temperature handling
# - System status monitoring
# - Debug logging sensors

# ============================================
# System Status Text Sensors (Debug/Logging)
# ============================================
text_sensor:
  - platform: template
    name: "Main Logs"
    id: ${id_prefix}main_logs
    icon: "mdi:text-box-outline"
    
  - platform: template
    name: "Position Logs"
    id: ${id_prefix}position_logs
    icon: "mdi:text-box-check-outline"
    
  - platform: template
    name: "BEMF Logs"
    id: ${id_prefix}bemf_logs
    icon: "mdi:flash"
    
  - platform: template
    name: "Controller Mode"
    id: ${id_prefix}controller_mode
    icon: "mdi:cog"
    lambda: |-
      // Check connectivity status
      bool wifi_connected = WiFi.isConnected();
      bool api_connected = api_is_connected();  // ESPHome API (Home Assistant)
      
      if (!wifi_connected) {
        return {"Offline - WiFi disconnected"};
      } else if (!api_connected) {
        return {"Standalone - No HA connection"};
      } else {
        return {"Connected - Home Assistant"};
      }
    update_interval: 30s

  - platform: template
    name: "System Status"
    id: ${id_prefix}system_status
    icon: "mdi:information-outline"
    update_interval: 30s
    lambda: |-
      float avg_pos = id(${id_prefix}avg_valve_position).state;
      bool balancing = id(${id_prefix}balancing_enabled).state;
      
      std::string status = "";
      
      if (!balancing) {
        status = "Balancing OFF";
      } else if (avg_pos < 30) {
        status = "Low demand";
      } else if (avg_pos > 90) {
        status = "High demand";
      } else if (avg_pos >= 50 && avg_pos <= 80) {
        status = "Optimal (50-80%)";
      } else {
        status = "Normal operation";
      }
      
      return {status};

# ============================================
# Fallback Temperature Sensor
# ============================================
# Used when external temperature sensors are unavailable
sensor:
  - platform: template
    name: "Fallback Temperature"
    id: ${id_prefix}fallback_temperature
    icon: "mdi:thermometer-alert"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      // Returns a reasonable fallback temperature
      // In a real scenario, this could be based on time of day, season, etc.
      return 20.0;
    update_interval: 5min

  - platform: template
    name: "Active Zones Count"
    id: ${id_prefix}active_zones_count
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int count = 0;
      // Count zones not in OVERHEATED state
      if (id(${id_prefix}zone_1_state) != 0) count++;
      if (id(${id_prefix}zone_2_state) != 0) count++;
      if (id(${id_prefix}zone_3_state) != 0) count++;
      if (id(${id_prefix}zone_4_state) != 0) count++;
      if (id(${id_prefix}zone_5_state) != 0) count++;
      if (id(${id_prefix}zone_6_state) != 0) count++;
      if (id(${id_prefix}zone_7_state) != 0) count++;
      if (id(${id_prefix}zone_8_state) != 0) count++;
      return count;

  - platform: template
    name: "Zones in Demand"
    id: ${id_prefix}zones_in_demand
    icon: "mdi:fire"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int count = 0;
      // Count zones in DEMAND state (state == 2)
      if (id(${id_prefix}zone_1_state) == 2) count++;
      if (id(${id_prefix}zone_2_state) == 2) count++;
      if (id(${id_prefix}zone_3_state) == 2) count++;
      if (id(${id_prefix}zone_4_state) == 2) count++;
      if (id(${id_prefix}zone_5_state) == 2) count++;
      if (id(${id_prefix}zone_6_state) == 2) count++;
      if (id(${id_prefix}zone_7_state) == 2) count++;
      if (id(${id_prefix}zone_8_state) == 2) count++;
      return count;

  - platform: template
    name: "Zones Overheated"
    id: ${id_prefix}zones_overheated
    icon: "mdi:thermometer-high"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int count = 0;
      // Count zones in OVERHEATED state (state == 0)
      if (id(${id_prefix}zone_1_state) == 0) count++;
      if (id(${id_prefix}zone_2_state) == 0) count++;
      if (id(${id_prefix}zone_3_state) == 0) count++;
      if (id(${id_prefix}zone_4_state) == 0) count++;
      if (id(${id_prefix}zone_5_state) == 0) count++;
      if (id(${id_prefix}zone_6_state) == 0) count++;
      if (id(${id_prefix}zone_7_state) == 0) count++;
      if (id(${id_prefix}zone_8_state) == 0) count++;
      return count;

# ============================================
# Watchdog and Safety Features
# ============================================
switch:
  - platform: template
    name: "Standalone Mode"
    id: ${id_prefix}standalone_mode
    icon: "mdi:lan-disconnect"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.log: "Standalone mode enabled - using local control only"
    turn_off_action:
      - logger.log: "Standalone mode disabled - using Home Assistant sensors"

binary_sensor:
  - platform: template
    name: "All Zones Satisfied"
    id: ${id_prefix}all_zones_satisfied
    icon: "mdi:check-circle"
    lambda: |-
      // All zones are either SATISFIED (1) or OVERHEATED (0)
      // No zones in DEMAND (2)
      for (int i = 1; i <= 8; i++) {
        int* states[] = {
          &id(${id_prefix}zone_1_state), &id(${id_prefix}zone_2_state),
          &id(${id_prefix}zone_3_state), &id(${id_prefix}zone_4_state),
          &id(${id_prefix}zone_5_state), &id(${id_prefix}zone_6_state),
          &id(${id_prefix}zone_7_state), &id(${id_prefix}zone_8_state)
        };
        if (*states[i-1] == 2) return false;  // DEMAND
      }
      return true;

  - platform: template
    name: "Any Zone Overheated"
    id: ${id_prefix}any_zone_overheated
    icon: "mdi:alert-circle"
    lambda: |-
      if (id(${id_prefix}zone_1_state) == 0) return true;
      if (id(${id_prefix}zone_2_state) == 0) return true;
      if (id(${id_prefix}zone_3_state) == 0) return true;
      if (id(${id_prefix}zone_4_state) == 0) return true;
      if (id(${id_prefix}zone_5_state) == 0) return true;
      if (id(${id_prefix}zone_6_state) == 0) return true;
      if (id(${id_prefix}zone_7_state) == 0) return true;
      if (id(${id_prefix}zone_8_state) == 0) return true;
      return false;

# ============================================
# Safety Interval - Ensure Minimum Flow
# ============================================
interval:
  - interval: 5min
    then:
      - lambda: |-
          // Safety check: Ensure at least minimum flow is maintained
          // This runs independently of the main control loop
          
          float min_opening = id(${id_prefix}minimum_valve_opening).state / 100.0;
          bool balancing_enabled = id(${id_prefix}balancing_enabled).state;
          
          if (!balancing_enabled) {
            ESP_LOGD("standalone", "Balancing disabled, skipping safety check");
            return;
          }
          
          // Count how many zones are below minimum (excluding OFF zones)
          int below_min = 0;
          int total_active = 0;
          
          for (auto *cover : App.get_covers()) {
            if (cover->position > 0.01) {  // Zone is active
              total_active++;
              if (cover->position < min_opening) {
                below_min++;
              }
            }
          }
          
          if (below_min > 0 && total_active > 0) {
            ESP_LOGW("standalone", "Safety: %d of %d active zones below minimum opening", 
                     below_min, total_active);
          }

  # Periodic status log
  - interval: 15min
    then:
      - lambda: |-
          float avg_pos = id(${id_prefix}avg_valve_position).state;
          int active = id(${id_prefix}active_zones_count).state;
          int demand = id(${id_prefix}zones_in_demand).state;
          int overheated = id(${id_prefix}zones_overheated).state;
          
          ESP_LOGI("standalone", "Status: avg=%.1f%%, active=%d, demand=%d, overheated=%d",
                   avg_pos, active, demand, overheated);
