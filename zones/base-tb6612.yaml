# ============================================
# Zone Base Infrastructure (TB6612FNG)
# ============================================
# Common components for all control profiles.
# Uses TB6612FNG motor driver with current-based endstop detection.
#
# Required vars:
#   zone_number: "1"             # 1-8
#   motor_number: "1"            # 1-8 (motor assigned to this zone)
#   id: "living"
#   friendly_name: "Living Room"
#
# Optional vars:
#   current_factor: "1.7"        # Multiplier for mean current (endstop detection)
#   zone_area_default: "15"
#   zone_max_opening_default: "90"

# ============================================
# Zone State Globals
# ============================================
globals:
  - id: ${id_prefix}zone_${zone_number}_state
    type: int
    initial_value: '-1'  # -1=unknown, 0=overheated, 1=satisfied, 2=demand
    
  - id: ${id_prefix}zone_${zone_number}_was_overheated
    type: bool
    initial_value: 'false'
    
  - id: ${id_prefix}zone_${zone_number}_hydraulic_factor
    type: float
    initial_value: '0.0'

  # Motor operation tracking
  - id: motor_${motor_number}_running
    type: bool
    initial_value: 'false'
    
  - id: motor_${motor_number}_target_position
    type: float
    initial_value: '0.0'
    
  - id: motor_${motor_number}_current_samples
    type: int
    initial_value: '0'
    
  - id: motor_${motor_number}_current_sum
    type: float
    initial_value: '0.0'

# ============================================
# Zone Parameters
# ============================================
number:
  - platform: template
    name: "${friendly_name} Area"
    id: ${id_prefix}zone_${zone_number}_area
    icon: "mdi:floor-plan"
    unit_of_measurement: "m²"
    optimistic: true
    min_value: 1
    max_value: 100
    step: 0.5
    restore_value: true
    initial_value: ${zone_area_default}
    web_server:
      sorting_group_id: sorting_group_zone_${zone_number}
    
  - platform: template
    name: "${friendly_name} Max Opening"
    id: ${id_prefix}zone_${zone_number}_max_opening
    icon: "mdi:valve-open"
    unit_of_measurement: "%"
    optimistic: true
    min_value: 50
    max_value: 100
    step: 5
    restore_value: true
    initial_value: ${zone_max_opening_default}
    web_server:
      sorting_group_id: sorting_group_zone_${zone_number}

  - platform: template
    name: "Current Factor ${zone_number}"
    id: current_factor_${zone_number}
    icon: "mdi:current-ac"
    optimistic: true
    min_value: 1.2
    max_value: 3.0
    step: 0.1
    restore_value: true
    initial_value: ${current_factor}
    web_server:
      sorting_group_id: sorting_group_debug

# ============================================
# Valve Cover (time + current-based endstop)
# ============================================
cover:
  - platform: time_based
    name: "CH${zone_number}"
    device_class: shutter
    id: CH${zone_number}_cover
    
    open_action:
      - script.execute:
          id: motor_zone_${zone_number}_open
          
    open_duration: 60s
    
    close_action:
      - script.execute:
          id: motor_zone_${zone_number}_close
          
    close_duration: 60s
    
    stop_action:
      - script.execute:
          id: motor_zone_${zone_number}_stop
          
    assumed_state: true
    web_server:
      sorting_group_id: sorting_group_zone_${zone_number}

# ============================================
# Zone Motor Control Switches
# ============================================
switch:
  - platform: template
    name: "Run ${friendly_name} Check"
    turn_on_action:
      - script.execute: TH${zone_number}_check
    web_server:
      sorting_group_id: sorting_group_zone_${zone_number}

# ============================================
# Current-based Endstop Detection
# ============================================
binary_sensor:
  - platform: template
    id: endstop_${zone_number}_sensor
    name: "Endstop CH${zone_number}"
    internal: true
    lambda: |-
      // Only check when this motor is running
      if (!id(motor_${motor_number}_running)) {
        return false;
      }
      
      // Get current reading
      float current = id(${id_prefix}motor_current_ma).state;
      
      // Get mean current for this motor
      float mean_current = id(motor_mean_current_${motor_number});
      float threshold_factor = id(current_factor_${zone_number}).state;
      
      // Detect overcurrent (endstop reached)
      float high_threshold = mean_current * threshold_factor;
      if (current > high_threshold || current > id(${id_prefix}current_threshold_high).state) {
        ESP_LOGD("endstop", "CH${zone_number} overcurrent: %.1f mA (threshold: %.1f mA)", 
                 current, high_threshold);
        return true;
      }
      
      return false;
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("endstop", "CH${zone_number} endstop reached");
            
            // Determine if opening or closing
            auto cover = id(CH${zone_number}_cover);
            if (cover.current_operation == COVER_OPERATION_OPENING) {
              cover.position = 1.0;  // Fully open
            } else if (cover.current_operation == COVER_OPERATION_CLOSING) {
              cover.position = 0.0;  // Fully closed
            }
            cover.publish_state();
            
        - script.execute:
            id: motor_zone_${zone_number}_stop

# ============================================
# Undercurrent Detection (no motor connected)
# ============================================
interval:
  - interval: 200ms
    then:
      - lambda: |-
          // Only check when motor is running and has been running for a bit
          if (!id(motor_${motor_number}_running)) {
            return;
          }
          
          float current = id(${id_prefix}motor_current_ma).state;
          float low_threshold = id(${id_prefix}current_threshold_low).state;
          
          // Collect samples for mean current calculation
          id(motor_${motor_number}_current_sum) += current;
          id(motor_${motor_number}_current_samples)++;
          
          // Check for undercurrent (no motor connected)
          if (id(motor_${motor_number}_current_samples) > 10 && current < low_threshold) {
            ESP_LOGW("endstop", "CH${zone_number} undercurrent: %.1f mA (no motor?)", current);
            // Could stop motor here if needed
          }

# ============================================
# Calculated Sensors
# ============================================
sensor:
  - platform: template
    name: "${friendly_name} Pipe Length"
    id: ${id_prefix}zone_${zone_number}_pipe_length
    icon: "mdi:ruler"
    unit_of_measurement: "m"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      float area = id(${id_prefix}zone_${zone_number}_area).state;
      float spacing = id(${id_prefix}pipe_spacing).state / 1000.0;
      if (spacing > 0) return area / spacing;
      return 0;
    web_server:
      sorting_group_id: sorting_group_zone_${zone_number}

# ============================================
# Motor Control Scripts for this Zone
# ============================================
script:
  # Open valve (motor direction = open)
  - id: motor_zone_${zone_number}_open
    then:
      - lambda: |-
          if (id(motor_mutex)) {
            ESP_LOGW("motor", "Cannot open CH${zone_number}: another motor is running");
            return;
          }
          ESP_LOGI("motor", "CH${zone_number} opening (motor ${motor_number})");
          id(motor_${motor_number}_running) = true;
          id(motor_${motor_number}_current_samples) = 0;
          id(motor_${motor_number}_current_sum) = 0.0;
      - script.execute:
          id: motor_start
          motor_num: ${motor_number}
          direction: 1  # Open

  # Close valve (motor direction = close)
  - id: motor_zone_${zone_number}_close
    then:
      - lambda: |-
          if (id(motor_mutex)) {
            ESP_LOGW("motor", "Cannot close CH${zone_number}: another motor is running");
            return;
          }
          ESP_LOGI("motor", "CH${zone_number} closing (motor ${motor_number})");
          id(motor_${motor_number}_running) = true;
          id(motor_${motor_number}_current_samples) = 0;
          id(motor_${motor_number}_current_sum) = 0.0;
      - script.execute:
          id: motor_start
          motor_num: ${motor_number}
          direction: 0  # Close

  # Stop valve motor
  - id: motor_zone_${zone_number}_stop
    then:
      - lambda: |-
          ESP_LOGI("motor", "CH${zone_number} stopping (motor ${motor_number})");
          
          // Update mean current if we have samples
          if (id(motor_${motor_number}_current_samples) > 20) {
            float new_mean = id(motor_${motor_number}_current_sum) / 
                            id(motor_${motor_number}_current_samples);
            // Blend with existing mean (80% old, 20% new)
            float old_mean = id(motor_mean_current_${motor_number});
            id(motor_mean_current_${motor_number}) = old_mean * 0.8 + new_mean * 0.2;
            ESP_LOGD("motor", "CH${zone_number} mean current updated: %.1f mA", 
                     id(motor_mean_current_${motor_number}));
          }
          
          id(motor_${motor_number}_running) = false;
      - script.execute:
          id: motor_stop
          motor_num: ${motor_number}

  # Calibration script
  - id: calibrate_CH${zone_number}_cover
    then:
      - logger.log:
          format: "Calibrate CH${zone_number} (${friendly_name})"
          tag: heat_ctrl_main
      - cover.close: CH${zone_number}_cover
      - wait_until:
          condition:
            lambda: 'return !id(motor_${motor_number}_running);'
          timeout: 70s
      - delay: 2s
      - cover.open: CH${zone_number}_cover
      - wait_until:
          condition:
            lambda: 'return !id(motor_${motor_number}_running);'
          timeout: 70s
      - delay: 2s
      - cover.close: CH${zone_number}_cover
      - wait_until:
          condition:
            lambda: 'return !id(motor_${motor_number}_running);'
          timeout: 70s
      - logger.log:
          format: "Calibrate CH${zone_number} complete"
          tag: heat_ctrl_main
