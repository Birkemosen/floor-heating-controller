# ============================================
# Zone with Linear Control (Combined)
# ============================================
# Complete zone: base infrastructure + linear control profile.
# Use this file for all zones when using linear control.

packages:
  base: !include
    file: base.yaml
    vars:
      zone_number: ${zone_number}
      id: ${id}
      friendly_name: ${friendly_name}
      bemf_trigger_initial: ${bemf_trigger_initial}
      zone_area_default: ${zone_area_default}
      zone_max_opening_default: ${zone_max_opening_default}
      bemf_sensor_adc: ${bemf_sensor_adc}
      bemf_linked_channel: ${bemf_linked_channel}
      sn74hc595_IA_pin: ${sn74hc595_IA_pin}
      sn74hc595_IB_pin: ${sn74hc595_IB_pin}

  control: !include
    file: ../control/linear.yaml
    vars:
      zone_number: ${zone_number}
      id: ${id}
      friendly_name: ${friendly_name}
      temperature_sensor: ${temperature_sensor}
      default_preset: ${default_preset}
      preset_home_temp: ${preset_home_temp}
      preset_away_temp: ${preset_away_temp}
      preset_boost_temp: ${preset_boost_temp}
      check_interval: ${check_interval}
      bemf_linked_channel: ${bemf_linked_channel}
